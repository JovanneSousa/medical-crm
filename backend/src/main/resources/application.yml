server:
  port: 8080

spring:
  application:
    name: omnimed-crm-backend
  datasource:
    url: jdbc:h2:mem:omnimed_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

# Configurações do Telegram Bot e Omnichannel
omnimed:
  telegram:
    enabled: false # Ligue para 'true' ao fornecer o token do seu bot
    bot-token: "${TELEGRAM_BOT_TOKEN:}"
    bot-username: "${TELEGRAM_BOT_USERNAME:OmniMedBot}"
    polling-interval-ms: 2000
  cors:
    allowed-origins: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"

logging:
  level:
    com.omnimed.crm: INFO
    org.springframework.web: INFO
