version: '3.8'

services:
  # Gateway WhatsApp gratuito baseado em Evolution API / Baileys
  evolution_api:
    image: atendai/evolution-api:v2.1.2
    container_name: omnimed_evolution_api
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - SERVER_URL=http://localhost:8081
      - DOCKER_ENV=true
      - LOG_LEVEL=ERROR,WARN,INFO
      - LOG_COLOR=true
      - LOG_BAILEYS=error
      - AUTHENTICATION_API_KEY=omnimed_secret_token_123
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:evolution_pass@evolution_db:5432/evolution?schema=public
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_MESSAGE_UPSERT=false
      - WEBHOOK_GLOBAL_ENABLED=false
    depends_on:
      evolution_db:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances

  # Banco de persistência para as sessões do WhatsApp e tokens
  evolution_db:
    image: postgres:15-alpine
    container_name: omnimed_evolution_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=evolution_pass
      - POSTGRES_DB=evolution
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  evolution_instances:
    name: omnimed_evolution_instances
  evolution_db_data:
    name: omnimed_evolution_db_data
